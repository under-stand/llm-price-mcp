[project]
name = "llm-price-mcp"
version = "0.2.0"
description = "MCP server that lets AI agents compare LLM API prices (OpenRouter), GPU rental prices and self-hosting cost."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "jiegang li" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.8.0",
    "httpx>=0.27",
]
keywords = ["mcp", "llm", "pricing", "openrouter", "model-context-protocol", "gpu", "self-hosting"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/under-stand/llm-price-mcp"
Issues = "https://github.com/under-stand/llm-price-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
llm-price-mcp = "llm_price_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_price_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
